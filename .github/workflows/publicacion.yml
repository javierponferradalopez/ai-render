name: publicación

# Los seis pasos del ADR-0013, disparados por el tag y por nada más: el
# `marketplace.json` se genera desde el tag y nunca se edita a mano, porque
# `/plugin update` descarga el zip entero *antes* de comparar identidades y un
# arreglo publicado sin subir la versión se baja, se tira y no avisa.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: macos-latest
    steps:
      # Historia entera, no la del tag: el último paso commitea el catálogo en
      # `main`, y empujar desde un clon superficial es de las cosas que el
      # servidor puede rechazar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      # La misma puerta que la CI de cada commit. Un tag no la salta: entre lo
      # que corre `make verify` está que el manifiesto de la caja declare la
      # versión del crate, que es la que el tag tiene que repetir.
      - run: make verify

      - name: compilar las dos arquitecturas
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: lipo
        run: |
          lipo -create -output "$RUNNER_TEMP/flipchart" \
            target/aarch64-apple-darwin/release/flipchart \
            target/x86_64-apple-darwin/release/flipchart
          lipo -info "$RUNNER_TEMP/flipchart"

      # En Apple Silicon todo ejecutable necesita al menos firma ad-hoc para
      # correr. Rust la genera al compilar, pero **sólo en la mitad nativa**: la
      # x86_64 cruzada sale sin firmar, y el `lipo` conserva la asimetría.
      #
      # Medido, y es la trampa: sobre el universal a medio firmar `codesign -dv`
      # contesta `Signature=adhoc` —lee la rebanada nativa— y el binario corre
      # en este runner. Quien se da cuenta es `--verify`, que mira las dos. Sin
      # este paso el producto se rompería sólo en los Mac Intel, que es donde no
      # lo prueba nadie.
      #
      # Sin notarización: medido que el binario extraído del zip no lleva
      # `com.apple.quarantine`, así que la ejecución no consulta a Gatekeeper.
      - name: re-firmar ad-hoc y verificar que la firma cubre las dos rebanadas
        run: |
          codesign -s - -f "$RUNNER_TEMP/flipchart"
          codesign --verify --verbose=2 "$RUNNER_TEMP/flipchart"
          for arco in arm64 x86_64; do
            codesign -dv --arch "$arco" "$RUNNER_TEMP/flipchart" 2>&1 \
              | grep -qx 'Signature=adhoc' \
              || { echo "la rebanada $arco no quedó firmada ad-hoc"; exit 1; }
          done
          ls -l "$RUNNER_TEMP/flipchart"

      - name: empaquetar con Info-ZIP y calcular el sha256
        run: |
          zip=$(publicacion/empaqueta.sh \
            "$GITHUB_REF_NAME" "$RUNNER_TEMP/flipchart" "$RUNNER_TEMP")
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: generar el catálogo desde el tag
        run: |
          publicacion/catalogo.sh "$GITHUB_REF_NAME" "$ZIP" > "$RUNNER_TEMP/marketplace.json"
          cat "$RUNNER_TEMP/marketplace.json"

      # El asset va antes que el catálogo: el catálogo que se publica en `main`
      # es la URL que el usuario tiene tecleada, así que no puede apuntar ni un
      # segundo a un asset que todavía no existe.
      - name: el zip como asset del release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --notes 'Se instala por `/plugin`, con las dos líneas del README. Nada que bajar a mano.'

      # Medido: el asset recién subido tarda un instante en ser servible, y un
      # 404 de carrera se lee como si la entrada del catálogo fuera mala.
      - name: esperar a que el asset se sirva
        run: |
          url=$(sed -n 's/.*"url": "\(.*\)".*/\1/p' "$RUNNER_TEMP/marketplace.json")
          for _ in $(seq 12); do
            curl -fsIL -o /dev/null "$url" && exit 0
            sleep 5
          done
          echo "el asset sigue sin servirse: $url"
          exit 1

      - name: commitear el catálogo en main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/marketplace.json" marketplace.json
          git add marketplace.json
          git commit -m "chore(publicación): el catálogo apunta a $GITHUB_REF_NAME"
          git push origin main
